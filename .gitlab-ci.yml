stages:
  - test
  - audit
  - mirror

test:
  stage: test
  image: babashka/babashka:latest
  script:
    - bb aur_audit_test.clj

self-audit:
  stage: audit
  image: babashka/babashka:latest
  script:
    - bb aur_audit.clj

mirror-github:
  stage: mirror
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git remote set-url origin "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/nurazhardotcom/${CI_PROJECT_NAME}.git"
    - git push origin HEAD:main --force
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 0
